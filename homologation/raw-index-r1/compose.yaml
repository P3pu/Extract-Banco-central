name: banco-central-raw-r1

services:
  db:
    image: postgres:16.13-trixie
    profiles: [manual]
    restart: "no"
    network_mode: none
    environment:
      POSTGRES_DB: raw_r1_homolog
      POSTGRES_USER: raw_r1
      # Apenas para o container isolado, sem rede e sem porta publicada.
      POSTGRES_HOST_AUTH_METHOD: trust
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - raw_r1_pgdata:/var/lib/postgresql/data
      - ../../sql/postgres/003b_create_magento_sales_order_item.sql:/workspace/contract.sql:ro
      - ../../sql/postgres/migrations:/workspace/migrations:ro
      - ./:/workspace/r1:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h /var/run/postgresql -U raw_r1 -d raw_r1_homolog"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  raw_r1_pgdata:
