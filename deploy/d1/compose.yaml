name: banco-central-executor-d1

services:
  executor:
    profiles: [manual]
    build:
      context: ../..
      dockerfile: deploy/d1/Dockerfile
    image: banco-central-executor:d1-review
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,mode=1777,size=8m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Somente segredos do executor; NUNCA montar PGDATA/volumes do PostgreSQL.
    volumes:
      - ${D1_SECRET_DIR:-/etc/bcd-d1/secrets}:/run/d1-secrets:ro
    environment:
      D1_ENABLE_INCREMENTALS: ${D1_ENABLE_INCREMENTALS:-no}
      POSTGRES_HOST: ${POSTGRES_HOST:-UNSET}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DATABASE: Atendimento
      POSTGRES_USER: ${POSTGRES_USER:-UNSET}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-verify-full}
      PGSSLROOTCERT: /run/d1-secrets/postgres_ca.pem
      MAGENTO_MYSQL_HOST: ${MAGENTO_MYSQL_HOST:-UNSET}
      MAGENTO_MYSQL_PORT: ${MAGENTO_MYSQL_PORT:-3306}
      MAGENTO_MYSQL_DATABASE: ${MAGENTO_MYSQL_DATABASE:-UNSET}
      MAGENTO_MYSQL_USER: ${MAGENTO_MYSQL_USER:-UNSET}
      ATIVO_MYSQL_HOST: ${ATIVO_MYSQL_HOST:-UNSET}
      ATIVO_MYSQL_PORT: ${ATIVO_MYSQL_PORT:-3306}
      ATIVO_MYSQL_DATABASE: ${ATIVO_MYSQL_DATABASE:-UNSET}
      ATIVO_MYSQL_USER: ${ATIVO_MYSQL_USER:-UNSET}
      MYSQL_SSL_CA: /run/d1-secrets/mysql_ca.pem
      BATCH_SIZE: ${BATCH_SIZE:-10000}
      RECONCILIATION_DAYS: ${RECONCILIATION_DAYS:-30}
      CONNECT_TIMEOUT: ${CONNECT_TIMEOUT:-10}
    healthcheck:
      test: [CMD, "python", "-m", "deploy.d1.entrypoint", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [source_egress]

networks:
  source_egress:
    driver: bridge
